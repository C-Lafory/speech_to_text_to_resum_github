version: "3.8"

services:
  # 🐬 Service MySQL
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: test
      MYSQL_PASSWORD: test
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  # 🔁 Migration automatique via golang-migrate
  migrate:
    image: migrate/migrate
    container_name: db_migrate
    volumes:
      - ./backend_golang/migrations:/migrations
    command:
      [
        "-path=/migrations",
        "-database=mysql://test:test@tcp(mysql:3306)/mydatabase",
        "up"
      ]
    depends_on:
      - mysql

  # 🟨 Backend Golang
  backend_golang:
    build:
      context: ./backend_golang
      dockerfile: Dockerfile.golang
    container_name: backend_golang
    ports:
      - "8080:8080"
    volumes:
      - ./backend_golang:/app
    env_file:
      - ./backend_golang/.env
    depends_on:
      - mysql
      - main_api
      - tts_service
    restart: unless-stopped

  # 🔵 API Python principale
  main_api:
    image: testcome-main_api
    container_name: main_api
    ports:
      - "8000:8000"
    env_file:
      - ./backend_python/.env
    restart: unless-stopped

  # 🔊 Service TTS Python
  tts_service:
    image: testcome-tts_service
    container_name: tts_service
    ports:
      - "8001:8001"
    env_file:
      - ./backend_python/.env
    restart: unless-stopped

volumes:
  mysql_data:
