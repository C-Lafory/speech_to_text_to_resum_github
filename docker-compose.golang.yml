services:
  # 🐬 Base de données MySQL
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: test
      MYSQL_PASSWORD: test
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  # 🔁 Migrations SQL automatiques
  migrate:
    image: migrate/migrate
    container_name: db_migrate
    volumes:
      - ./backend_golang/wait-for-it.sh:/wait-for-it.sh
      - ./backend_golang/migrations:/migrations
    command: [
      "/wait-for-it.sh", "mysql:3306", "--timeout=30", "--strict", "--",
      "migrate", "-path=/migrations",
      "-database=mysql://test:test@tcp(mysql:3306)/mydatabase", "up"
    ]
    depends_on:
      - mysql
    restart: "no"


  # 🟨 Backend Go
  backend_golang:
    build:
      context: ./backend_golang
      dockerfile: Dockerfile.golang
    container_name: backend_golang
    ports:
      - "8080:8080"
    env_file:
      - ./backend_golang/.env
    environment:
      - GIN_MODE=release
    depends_on:
      - mysql
      - migrate
      - main_api
      - tts_service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 🔵 FastAPI - Transcription + Résumé
  main_api:
    image: testcome-main_api
    container_name: main_api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - MODEL_DIR=/app/models
      - IS_MAIN_SERVICE=1
      - INTERNAL_API_KEY=sk-internal-backend-python-1234
    volumes:
      - ./backend_python:/app
      - ./models:/app/models
    command: ./init_main.sh
    depends_on:
      - ollama
    restart: unless-stopped

  # 🔊 FastAPI - Synthèse vocale (TTS)
  tts_service:
    image: testcome-tts_service
    container_name: tts_service
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - MODEL_DIR=/app/models
      - IS_TTS_SERVICE=1
      - INTERNAL_API_KEY=sk-internal-backend-python-1234
    volumes:
      - ./backend_python:/app
      - ./models:/app/models
    command: ./init_tts.sh
    restart: unless-stopped

  # 🧠 Ollama - Serveur Mistral LLM
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    command: serve
    restart: unless-stopped

volumes:
  mysql_data:
  ollama_data:
