services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: test
      MYSQL_PASSWORD: test
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  db_migrate:
    image: migrate/migrate
    container_name: db_migrate
    volumes:
      - ./backend_golang/migrations:/migrations
    command:
      [
        "-path=/migrations",
        "-database=mysql://test:test@tcp(mysql:3306)/mydatabase",
        "up"
      ]
    depends_on:
      - mysql
    restart: "no"

  backend_golang:
    build:
      context: ./backend_golang
      dockerfile: Dockerfile.golang
    container_name: backend_golang
    ports:
      - "8080:8080"
    env_file:
      - ./backend_golang/.env
    depends_on:
      - mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  mysql_data:
