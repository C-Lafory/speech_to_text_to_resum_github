

services:
  # 🐬 MySQL
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: test
      MYSQL_PASSWORD: test
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  # 🔁 Migrations
  migrate:
    image: migrate/migrate
    container_name: db_migrate
    volumes:
      - ./backend_golang/migrations:/migrations
      - ./backend_golang/wait-for-it.sh:/wait-for-it.sh
    command:
      [
        "./wait-for-it.sh", "mysql:3306", "--timeout=30", "--strict", "--",
        "migrate", "-path=/migrations",
        "-database=mysql://test:test@tcp(mysql:3306)/mydatabase", "up"
      ]
    depends_on:
      - mysql
    restart: "no"

  # 🟨 Backend Go
  backend_golang:
    build:
      context: ./backend_golang
      dockerfile: Dockerfile.golang
    container_name: backend_golang
    ports:
      - "8080:8080"
    env_file:
      - ./backend_golang/.env
    depends_on:
      - mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ./backend_golang/wait-for-it.sh:/wait-for-it.sh
      - ./backend_golang/entrypoint.sh:/entrypoint.sh
    command: ["/entrypoint.sh"]

volumes:
  mysql_data:
