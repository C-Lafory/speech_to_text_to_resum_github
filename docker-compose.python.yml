version: "3.8"

services:
  # Service de modèles LLM (Mistral) via Ollama
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    command: serve
    restart: unless-stopped

  # Backend principal (Transcription + Résumé) - Python 3.12
  main_api:
    build:
      context: ./backend_python
      dockerfile: Dockerfile.main
    container_name: main_api
    ports:
      - "8000:8000"
    volumes:
      - ./backend_python:/app
      - ./models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
      - MODEL_DIR=/app/models
      - IS_MAIN_SERVICE=1
    env_file:
      - ./backend_python/.env  # ✅ Ajouté ici
    command: ./init_main.sh
    depends_on:
      - ollama
    restart: unless-stopped

  # Service TTS (Synthèse vocale) - Python 3.10
  tts_service:
    build:
      context: ./backend_python
      dockerfile: Dockerfile.tts
    container_name: tts_service
    ports:
      - "8001:8001"
    volumes:
      - ./backend_python:/app
      - ./models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
      - MODEL_DIR=/app/models
      - IS_TTS_SERVICE=1
    env_file:
      - ./backend_python/.env  # ✅ Ajouté ici aussi
    command: ./init_tts.sh
    restart: unless-stopped

volumes:
  ollama_data:
